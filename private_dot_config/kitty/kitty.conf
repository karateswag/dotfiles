# ~/.config/kitty/kitty.conf

# font_family       JetBrainsMonoNerdFont
# font_family       DejaVuSansMNerdFont
# font_family       FiraCodeNerdFont
font_family       SourceCodeProNerdFont
bold_font         auto
italic_font       auto
bold_italic_font  auto

font_size 12.0

cursor none

enable_audio_bell no

window_margin_width 35

foreground #ffffff
background #262335

background_opacity 0.8


#: black
color0 #262335
color8 #888690


#: red
color1 #fe4450
color9 #e55a5e


#: green
color2  #60ff60
color10 #72f1b8


#: yellow
color3  #fede5d
color11 #ea9652


#: blue
color4  #80a0ff
color12 #99b3ff


#: magenta
color5  #ff7edb
color13 #d884c7


#: cyan
color6  #03edf9
color14 #9af7fc


#: white
color7  #ffffff
color15 #d4d3d7

term xterm-256color
include themes/noctalia.conf
